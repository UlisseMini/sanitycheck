<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SanityCheck Analysis</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Miss Information theme CSS variables */
    body.theme-miss {
      --bg-primary: #1a1520;
      --bg-secondary: #231d2b;
      --bg-tertiary: #2d2638;
      --bg-hover: #3a3245;
      --text-primary: #f5f0fa;
      --text-secondary: #c4b8d4;
      --text-muted: #8b7fa3;
      --accent: #c084fc;
      --accent-hover: #d8b4fe;
      --accent-subtle: rgba(192, 132, 252, 0.12);
      --border: rgba(192, 132, 252, 0.15);
      --border-strong: rgba(192, 132, 252, 0.25);
    }
    
    /* Miss Information theme fonts */
    body.theme-miss {
      font-family: 'Quicksand', 'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    body.theme-miss h1, body.theme-miss h2 {
      font-family: 'Comfortaa', 'Quicksand', cursive;
    }
    
    /* Title variants */
    .title-sanity { display: inline; }
    .title-miss { display: none; }
    body.theme-miss .title-sanity { display: none; }
    body.theme-miss .title-miss { display: inline; }

    /* Side panel specific styles */
    html, body {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .side-panel-header {
      position: sticky;
      top: 0;
      background: var(--bg-primary);
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .side-panel-header .logo-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }
    
    .side-panel-header h1 {
      margin: 0;
      font-size: 20px;
    }

    .article-info {
      margin-bottom: 12px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 0;
      border-left: none;
      border-right: none;
    }

    .article-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .article-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .article-url {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #no-analysis {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    
    .container {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    #results-section {
      flex: 1;
      min-height: 0;
      padding: 0;
    }
    
    #results-content {
      flex: 1;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      padding: 0 16px 16px;
      border: none;
      border-radius: 0;
      background: transparent;
    }

    /* Compact side panel styling */
    #results-content .result-category,
    #results-content .result-item {
      border-radius: 0;
    }

    .side-panel-header {
      border-radius: 0;
      flex-shrink: 0;
    }

    .result-category {
      border-radius: 0 !important;
      margin-bottom: 8px;
    }

    .result-item {
      border-radius: 0 !important;
      margin-bottom: 0;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-left: 3px solid var(--accent);
      border-bottom: 1px solid var(--border);
    }
    
    .result-item:last-child {
      border-bottom: none;
    }

    .result-item-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .severity-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 0;
      font-weight: 600;
      text-transform: uppercase;
    }

    .result-quote {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-secondary);
      border-left: 2px solid var(--border);
      padding-left: 10px;
      margin: 8px 0;
      font-style: normal;
      text-transform: none;
    }
    
    .quote-toggle-icon {
      cursor: pointer;
      display: inline-block;
      margin-left: 6px;
      font-size: 12px;
      color: var(--accent);
      transition: transform 0.2s;
      user-select: none;
      vertical-align: baseline;
    }
    
    .quote-toggle-icon:hover {
      opacity: 0.7;
    }
    
    .quote-toggle-icon.expanded {
      transform: rotate(180deg);
    }
    
    .result-quote-wrapper {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    
    .result-quote-wrapper.expanded {
      max-height: 500px;
    }

    .result-explanation {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.6;
      margin: 0;
    }

    #no-analysis svg {
      width: 48px;
      height: 48px;
      stroke: var(--text-muted);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="side-panel-header">
    <img class="logo-icon" src="icon48.png" alt="Logo">
    <h1>
      <span class="title-sanity">SanityCheck</span>
      <span class="title-miss">Miss Information</span>
    </h1>
  </div>
  
  <div class="container">

    <div id="no-analysis" class="section">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      <p>No analysis yet</p>
      <p style="font-size: 12px; margin-top: 8px;">Click the extension icon and analyze an article to see results here.</p>
    </div>

    <div id="loading-section" class="section hidden">
      <div class="loader">
        <div class="loader-bar"></div>
      </div>
      <p class="loading-text">Analyzing logic structure...</p>
    </div>

    <div id="results-section" class="section hidden">
      <div class="article-info">
        <div class="article-title" id="article-title">Loading...</div>
        <div class="article-meta">
          <span id="article-wordcount">-</span>
          <span>•</span>
          <span class="article-url" id="article-url" title="">-</span>
        </div>
      </div>
      <div id="results-content"></div>
    </div>

    <div id="error-section" class="section hidden">
      <div class="error-card">
        <span class="error-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </span>
        <p id="error-message"></p>
      </div>
    </div>
  </div>

  <script src="debug.js"></script>
  <script src="side-panel.js"></script>
</body>
</html>
